name: One-time Coupang ad update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-coupang-ad.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace Coupang ad card
        shell: python
        run: |
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old_url = "https://link.coupang.com/a/gh5dg938wK"
          new_url = "https://link.coupang.com/a/gh6l6gdMR2?abTestInfo=100412_group_A"

          anchor = f'<a href="{old_url}"'
          start = s.find(anchor)
          if start < 0:
              raise SystemExit("Old Coupang ad card not found")

          end = s.find("</a>", start)
          if end < 0:
              raise SystemExit("Closing tag for old Coupang ad card not found")
          end += len("</a>")

          line_start = s.rfind("\n", 0, start) + 1
          indent = s[line_start:start]
          inner = indent + "  "

          new_card = (
              f'<a href="{new_url}" target="_blank" referrerpolicy="unsafe-url" class="ad-card">\n'
              f'{inner}<div class="ad-icon ad-icon-pink"><i class="fa-solid fa-shirt"></i></div>\n'
              f'{inner}<p>쿠팡을 추천 합니다! 👕<br>\n'
              f'{inner}   <b>MU랑 여성 데일리 라운드 골지 니트 반팔 2P</b></p>\n'
              f'{inner}<span class="ad-cta">보러가기 →</span>\n'
              f'{indent}</a>'
          )

          p.write_text(s[:start] + new_card + s[end:], encoding="utf-8")

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Coupang affiliate product"
          git push
