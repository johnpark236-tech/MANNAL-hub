name: Update Coupang Ad

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-coupang-ad.yml

permissions:
  contents: write

jobs:
  update-ad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update ad
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('https://link.coupang.com/a/eX7QDpkKAK','https://link.coupang.com/a/gh5dg938wK',1).replace('#꾸밈 사각 콩나물 재배기 + 노란 콩나물 콩 세트✨🪄','후라이드 치킨1',1).replace('#콩나물 재배기🌿🎨','후라이드 치킨2',1); p.write_text(s,encoding='utf-8')"
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update Coupang fried chicken ad"
          git push origin main
