name: Add Coupang Partners Ad

on:
  push:
    branches: [main]
    paths:
      - 'coupang_requests/*.json'
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: coupang-ad-writer
  cancel-in-progress: false

jobs:
  add-ad:
    if: github.event_name == 'push' || startsWith(github.event.issue.title, '[COUPANG-AD]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare request
        id: request
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "issues" ]; then
            python - <<'PY'
          import json, os, re
          body = os.environ.get('ISSUE_BODY', '')
          m = re.search(r'https://(?:www|link)\.coupang\.com/\S+', body)
          if not m:
              raise SystemExit('No Coupang URL found in issue body.')
          url = m.group(0).strip().rstrip('.,)]}>\"\'')
          with open('/tmp/coupang_request.json', 'w', encoding='utf-8') as f:
              json.dump({'url': url, 'rawText': body}, f, ensure_ascii=False)
          PY
            echo "file=/tmp/coupang_request.json" >> "$GITHUB_OUTPUT"
          else
            REQUEST_FILE="$(ls -1t coupang_requests/*.json | head -n 1)"
            echo "file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Process Coupang request
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          set -euo pipefail
          REQUEST_FILE="${{ steps.request.outputs.file }}"
          ACTION="$(python -c "import json; print(json.load(open('$REQUEST_FILE', encoding='utf-8')).get('action',''))")"
          if [ "$ACTION" = "remove_last_test_ads" ]; then
            python scripts/remove_last_11_test_ads.py
          else
            python scripts/add_coupang_ad.py "$REQUEST_FILE"
          fi

      - name: Commit index.html update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .coupang_last_result.json
          if git diff --cached --quiet; then
            echo 'No index.html change was necessary.'
          else
            git commit -m 'Update Coupang ads'
            git push origin main
          fi

      - name: Complete issue request
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            const transient = new Set([502, 503, 504]);

            async function withRetry(label, fn) {
              const maxAttempts = 5;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  const status = error?.status || error?.response?.status;
                  const retryable = transient.has(status);
                  if (!retryable || attempt === maxAttempts) {
                    throw error;
                  }
                  const waitMs = 5000 * attempt;
                  core.warning(`${label} failed with HTTP ${status}. Retry ${attempt}/${maxAttempts} after ${waitMs / 1000}s.`);
                  await sleep(waitMs);
                }
              }
            }

            await withRetry('Create completion comment', () =>
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '쿠팡 파트너스 링크 변환 및 광고 추가가 완료되었습니다.'
              })
            );

            await withRetry('Close issue', () =>
              github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              })
            );
