name: Add Coupang Partners Ad

on:
  push:
    branches: [main]
    paths:
      - 'coupang_requests/*.json'
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: coupang-ad-writer
  cancel-in-progress: false

jobs:
  add-ad:
    if: github.event_name == 'push' || startsWith(github.event.issue.title, '[COUPANG-AD]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare request
        id: request
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "issues" ]; then
            python - <<'PY'
          import json, os, re
          body = os.environ.get('ISSUE_BODY', '')
          m = re.search(r'https://www\.coupang\.com/\S+', body)
          if not m:
              raise SystemExit('No Coupang product URL found in issue body.')
          url = m.group(0).strip()
          with open('/tmp/coupang_request.json', 'w', encoding='utf-8') as f:
              json.dump({'url': url}, f, ensure_ascii=False)
          PY
            echo "file=/tmp/coupang_request.json" >> "$GITHUB_OUTPUT"
          else
            REQUEST_FILE="$(ls -1t coupang_requests/*.json | head -n 1)"
            echo "file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Convert URL and append ad
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          python scripts/add_coupang_ad.py "${{ steps.request.outputs.file }}"

      - name: Commit index.html update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .coupang_last_result.json
          if git diff --cached --quiet; then
            echo 'No index.html change was necessary.'
          else
            git commit -m 'Add Coupang Partners ad'
            git push origin main
          fi

      - name: Complete issue request
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '쿠팡 파트너스 링크 변환 및 광고 추가가 완료되었습니다.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
