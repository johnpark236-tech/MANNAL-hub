name: Remove Last 11 Test Ads
on:
  push:
    branches: [main]
    paths:
      - 'scripts/remove_last_11_test_ads.py'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove last 11 ad cards
        run: python scripts/remove_last_11_test_ads.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove last 11 test Coupang ads'
          git push origin main
