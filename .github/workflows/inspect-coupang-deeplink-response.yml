name: Inspect Coupang Product Search
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-coupang-deeplink-response.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect product search
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,json,hmac,hashlib,datetime,urllib.request,urllib.parse
          host='https://api-gateway.coupang.com'
          path='/v2/providers/affiliate_open_api/apis/openapi/products/search'
          for keyword in ['4697102527','계란']:
            query=urllib.parse.urlencode({'keyword':keyword,'limit':10})
            signed=datetime.datetime.now(datetime.timezone.utc).strftime('%y%m%dT%H%M%SZ')
            sig=hmac.new(os.environ['COUPANG_SECRET_KEY'].encode(),(signed+'GET'+path+query).encode(),hashlib.sha256).hexdigest()
            auth=f"CEA algorithm=HmacSHA256, access-key={os.environ['COUPANG_ACCESS_KEY']}, signed-date={signed}, signature={sig}"
            req=urllib.request.Request(host+path+'?'+query,headers={'Authorization':auth,'Content-Type':'application/json;charset=UTF-8'},method='GET')
            try:
              with urllib.request.urlopen(req,timeout=30) as r: payload=json.loads(r.read().decode())
              print('keyword=',keyword,'rCode=',payload.get('rCode'),'rMessage=',payload.get('rMessage'))
              data=payload.get('data') or []
              print('count=',len(data))
              for item in data:
                print('productId=',item.get('productId'),'productName=',item.get('productName'))
            except Exception as e:
              print('keyword=',keyword,'ERROR=',repr(e))
          PY
