name: Comment Out Learning Buttons And Coupang Uploader

on:
  push:
    branches: [main]
    paths:
      - 'maintenance_requests/comment_out_learning_and_uploader_20260820.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html
        run: python scripts/comment_out_learning_and_uploader.py
      - name: Commit UI changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Hide learning buttons and Coupang uploader; update textbook heading'
          git push origin main
