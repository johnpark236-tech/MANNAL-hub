name: Add Coupang Uploader UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-coupang-uploader-ui.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Insert uploader UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="coupangUrlInput"' in s:
              print('Uploader UI already exists.')
              raise SystemExit(0)

          css = '''\n    /* ── 쿠팡 광고 업로더 ── */\n    .coupang-uploader {\n      margin-top: 28px;\n      background: var(--white);\n      border: 1.5px solid var(--border);\n      border-radius: 18px;\n      padding: 22px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n    .coupang-uploader h3 {\n      font-size: 17px;\n      font-weight: 900;\n      margin-bottom: 8px;\n    }\n    .coupang-uploader .upload-help {\n      font-size: 12px;\n      color: var(--muted);\n      margin-bottom: 12px;\n      line-height: 1.5;\n    }\n    .coupang-upload-row {\n      display: flex;\n      gap: 10px;\n    }\n    .coupang-upload-row input {\n      flex: 1;\n      min-width: 0;\n      border: 1.5px solid var(--border);\n      border-radius: 12px;\n      padding: 13px 14px;\n      font: inherit;\n      font-size: 13px;\n      outline: none;\n    }\n    .coupang-upload-row input:focus { border-color: var(--pink); }\n    .coupang-upload-row button {\n      border: 0;\n      border-radius: 12px;\n      padding: 0 18px;\n      background: linear-gradient(135deg, var(--pink), var(--coral));\n      color: #fff;\n      font-weight: 800;\n      cursor: pointer;\n      white-space: nowrap;\n    }\n    #coupangUploadStatus {\n      min-height: 18px;\n      margin-top: 9px;\n      font-size: 12px;\n      color: var(--muted);\n    }\n    @media (max-width: 560px) {\n      .coupang-upload-row { flex-direction: column; }\n      .coupang-upload-row button { padding: 12px 18px; }\n    }\n'''
          style_end = '\n  </style>'
          if style_end not in s:
              raise SystemExit('Could not find </style> marker.')
          s = s.replace(style_end, css + style_end, 1)

          html = '''\n    <section class="coupang-uploader" aria-label="쿠팡 광고 업로드">\n      <h3>🛒 쿠팡 광고 업로드</h3>\n      <p class="upload-help">쿠팡 일반 상품 링크를 붙여넣으세요. 파트너스 링크 변환과 광고 추가는 GitHub Actions에서 안전하게 처리됩니다.</p>\n      <div class="coupang-upload-row">\n        <input id="coupangUrlInput" type="url" inputmode="url" autocomplete="off" placeholder="https://www.coupang.com/vp/products/...">\n        <button id="coupangUploadBtn" type="button">업로드</button>\n      </div>\n      <p id="coupangUploadStatus">GitHub 요청 화면이 열리면 Submit new issue를 누르면 자동 처리됩니다.</p>\n    </section>\n'''
          marker = '    <p class="coupang-notice">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>\n\n  </main>'
          if marker not in s:
              raise SystemExit('Could not find Coupang section end marker.')
          s = s.replace(marker, '    <p class="coupang-notice">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>\n' + html + '\n  </main>', 1)

          js = '''\n  <script>\n    (function () {\n      const input = document.getElementById('coupangUrlInput');\n      const button = document.getElementById('coupangUploadBtn');\n      const status = document.getElementById('coupangUploadStatus');\n      if (!input || !button || !status) return;\n\n      button.addEventListener('click', function () {\n        const url = input.value.trim();\n        if (!url.startsWith('https://www.coupang.com/')) {\n          status.textContent = '올바른 쿠팡 상품 링크를 입력해주세요.';\n          input.focus();\n          return;\n        }\n        const title = '[COUPANG-AD] 광고 업로드 요청';\n        const body = '아래 쿠팡 상품을 파트너스 링크로 변환하여 index.html 마지막 광고 아래에 추가해주세요.\\n\\n' + url;\n        const issueUrl = 'https://github.com/johnpark236-tech/MANNAL-hub/issues/new?title=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(body);\n        status.textContent = 'GitHub 업로드 요청 화면으로 이동합니다...';\n        window.location.href = issueUrl;\n      });\n    })();\n  </script>\n'''
          body_end = '\n</body>'
          if body_end not in s:
              raise SystemExit('Could not find </body> marker.')
          s = s.replace(body_end, js + body_end, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add Coupang ad uploader UI'
          git push origin main
