name: Patch Current Egg Ad

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-current-egg-ad.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch current egg ad
        run: python scripts/patch_current_egg_ad.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .coupang_last_result.json
          git diff --cached --quiet && exit 0
          git commit -m 'Show exact egg product name'
          git push origin main
