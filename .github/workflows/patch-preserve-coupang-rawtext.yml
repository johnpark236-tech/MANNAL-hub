name: Patch Coupang Raw Text Preservation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-preserve-coupang-rawtext.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch script
        run: |
          python scripts/patch_preserve_coupang_rawtext.py
          python -m py_compile scripts/add_coupang_ad.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/add_coupang_ad.py
          git diff --cached --quiet && exit 0
          git commit -m 'Prefer Coupang share text product names'
          git push origin main
