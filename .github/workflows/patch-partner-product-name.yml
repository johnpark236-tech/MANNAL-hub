name: Patch Partners Product Name Lookup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-partner-product-name.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch script
        run: |
          python scripts/patch_partner_product_name.py
          python -m py_compile scripts/add_coupang_ad.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/add_coupang_ad.py
          git diff --cached --quiet && exit 0
          git commit -m 'Use Coupang Partners API product names on exact match'
          git push origin main
