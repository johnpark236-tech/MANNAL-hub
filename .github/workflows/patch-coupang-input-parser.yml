name: Patch Coupang Input Parser

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-coupang-input-parser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch uploader parser
        run: python scripts/patch_coupang_input_parser.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Accept pasted Coupang text blocks in uploader'
          git push origin main
